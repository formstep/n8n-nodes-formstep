name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      # n8n's verification scanner ignores eslint-disable comments, so this does too.
      - run: ./node_modules/.bin/eslint --no-inline-config credentials nodes
